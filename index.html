<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System (CRUD)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
                <div>
                    <h1 class="text-xl font-bold">Student Management System</h1>
                    <p class="text-xs text-indigo-200">FastAPI + MS Access (Complete CRUD: POST, GET, PUT, DELETE)</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="dbBadge"
                    class="text-xs font-semibold px-3 py-1.5 rounded-full bg-yellow-100 text-yellow-800 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span> Checking DB...
                </span>
                <a href="/docs" target="_blank"
                    class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-400 font-medium">
                    <i class="fa-solid fa-bolt mr-1"></i> Swagger API Docs
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">

        <!-- Database Alert Banner -->
        <div id="dbAlert" class="hidden mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg shadow-sm">
            <h3 class="font-bold text-red-800 text-sm">Database Setup Required!</h3>
            <p id="dbAlertText" class="text-xs text-red-700 mt-1"></p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Left: Add Student Form (POST) -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 sticky top-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-user-plus text-indigo-600"></i> Add Student
                        </h2>
                        <span
                            class="text-[10px] font-bold uppercase bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-mono">POST</span>
                    </div>

                    <form id="addStudentForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                            <input type="text" id="addName" required placeholder="Ali Ahmed"
                                class="w-full text-sm px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Roll Number</label>
                            <input type="text" id="addRollNo" required placeholder="BSCS-101"
                                class="w-full text-sm px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Course / Class</label>
                            <input type="text" id="addCourse" required placeholder="Computer Science"
                                class="w-full text-sm px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                            <input type="email" id="addEmail" required placeholder="ali@gmail.com"
                                class="w-full text-sm px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>

                        <button type="submit" id="btnSave"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg shadow transition text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-save"></i> Save Student (POST)
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right: Records Table (GET, PUT, DELETE) -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div
                        class="p-5 border-b border-slate-200 flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                        <div class="flex items-center gap-2">
                            <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-users text-indigo-600"></i> Students Records
                            </h2>
                            <span
                                class="text-[10px] font-bold uppercase bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-mono">GET</span>
                        </div>
                        <button onclick="loadStudents()"
                            class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg border text-slate-600 transition flex items-center gap-1 self-start sm:self-auto">
                            <i class="fa-solid fa-rotate-right"></i> Refresh Table
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-600 text-xs uppercase font-semibold border-b">
                                    <th class="py-3 px-4">ID</th>
                                    <th class="py-3 px-4">Roll No</th>
                                    <th class="py-3 px-4">Name</th>
                                    <th class="py-3 px-4">Course</th>
                                    <th class="py-3 px-4">Email</th>
                                    <th class="py-3 px-4 text-center">Actions (PUT / DEL)</th>
                                </tr>
                            </thead>
                            <tbody id="studentTable" class="divide-y divide-slate-100 text-sm">
                                <tr>
                                    <td colspan="6" class="text-center py-8 text-slate-400 text-xs">Records load ho rahe
                                        hain...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Edit Student Popup Modal (PUT) -->
    <div id="editModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 px-4">
        <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-md p-6">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                <div class="flex items-center gap-2">
                    <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-user-pen text-amber-500"></i> Edit Student
                    </h3>
                    <span
                        class="text-[10px] font-bold uppercase bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-mono">PUT</span>
                </div>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="editStudentForm" class="space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                    <input type="text" id="editName" required
                        class="w-full text-sm px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Roll Number</label>
                    <input type="text" id="editRollNo" required
                        class="w-full text-sm px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Course / Class</label>
                    <input type="text" id="editCourse" required
                        class="w-full text-sm px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                    <input type="email" id="editEmail" required
                        class="w-full text-sm px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none">
                </div>

                <div class="flex items-center justify-end space-x-2 pt-3 border-t">
                    <button type="button" onclick="closeEditModal()"
                        class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition">
                        Cancel
                    </button>
                    <button type="submit" id="btnUpdate"
                        class="px-4 py-2 text-xs font-semibold bg-amber-500 hover:bg-amber-600 text-white rounded-lg transition flex items-center gap-1.5 shadow">
                        <i class="fa-solid fa-check"></i> Update Student (PUT)
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allStudents = [];

        // Check Database Status
        async function checkDB() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const badge = document.getElementById('dbBadge');
                const alertBox = document.getElementById('dbAlert');

                if (data.status === 'ok' || data.connected === true) {
                    badge.className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-800 flex items-center gap-1.5";
                    badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-600"></span> DB Connected';
                    alertBox.classList.add('hidden');
                } else {
                    badge.className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-rose-100 text-rose-800 flex items-center gap-1.5";
                    badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-600"></span> DB Error';
                    alertBox.classList.remove('hidden');
                    document.getElementById('dbAlertText').innerText = data.message;
                }
            } catch (e) {
                console.error(e);
            }
        }

        // 1. GET (Read all students)
        async function loadStudents() {
            try {
                const res = await fetch('/students');
                const data = await res.json();
                allStudents = data;
                const tbody = document.getElementById('studentTable');
                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-slate-400 text-xs">Koi student record mojood nahi hai. Naya student add karein!</td></tr>';
                    return;
                }

                data.forEach(s => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition border-b">
                            <td class="py-3 px-4 font-mono text-xs text-slate-500">${s.id}</td>
                            <td class="py-3 px-4 font-semibold text-indigo-700">${escapeHtml(s.roll_no)}</td>
                            <td class="py-3 px-4">${escapeHtml(s.name)}</td>
                            <td class="py-3 px-4 text-xs text-slate-600">${escapeHtml(s.course)}</td>
                            <td class="py-3 px-4 text-xs text-slate-500">${escapeHtml(s.email)}</td>
                            <td class="py-3 px-4 text-center">
                                <div class="flex items-center justify-center space-x-2">
                                    <button onclick="openEditModal(${s.id})" title="Edit Student (PUT)"
                                        class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-2.5 py-1 rounded text-xs border border-amber-200 transition flex items-center gap-1">
                                        <i class="fa-solid fa-pen-to-square"></i> Edit (PUT)
                                    </button>
                                    <button onclick="deleteStudent(${s.id}, '${escapeHtml(s.name)}')" title="Delete Student"
                                        class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-2.5 py-1 rounded text-xs border border-rose-200 transition flex items-center gap-1">
                                        <i class="fa-solid fa-trash"></i> Delete
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error(e);
            }
        }

        // 2. POST (Add new student)
        document.getElementById('addStudentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSave');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

            const payload = {
                name: document.getElementById('addName').value.trim(),
                roll_no: document.getElementById('addRollNo').value.trim(),
                course: document.getElementById('addCourse').value.trim(),
                email: document.getElementById('addEmail').value.trim()
            };

            try {
                const res = await fetch('/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    document.getElementById('addStudentForm').reset();
                    await loadStudents();
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Error saving student');
                }
            } catch (err) {
                alert('Request failed');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-save"></i> Save Student (POST)';
            }
        });

        // 3. PUT (Edit Student Functions)
        function openEditModal(id) {
            const student = allStudents.find(s => s.id === id);
            if (!student) return;

            document.getElementById('editId').value = student.id;
            document.getElementById('editName').value = student.name;
            document.getElementById('editRollNo').value = student.roll_no;
            document.getElementById('editCourse').value = student.course;
            document.getElementById('editEmail').value = student.email;

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        document.getElementById('editStudentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const btn = document.getElementById('btnUpdate');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';

            const updatedData = {
                name: document.getElementById('editName').value.trim(),
                roll_no: document.getElementById('editRollNo').value.trim(),
                course: document.getElementById('editCourse').value.trim(),
                email: document.getElementById('editEmail').value.trim()
            };

            try {
                const res = await fetch(`/students/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });

                if (res.ok) {
                    closeEditModal();
                    await loadStudents();
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Update karte waqt error aya');
                }
            } catch (err) {
                alert('Update request failed');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Update Student (PUT)';
            }
        });

        // 4. DELETE (Remove student)
        async function deleteStudent(id, name) {
            if (!confirm(`Kya aap waqai "${name}" ko delete karna chahte hain?`)) return;
            try {
                const res = await fetch(`/students/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadStudents();
                } else {
                    alert('Delete nahi ho saka');
                }
            } catch (e) {
                console.error(e);
            }
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        checkDB();
        loadStudents();
    </script>
</body>

</html>
